[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "omega"
version = "0.1.0"
description = "omega — a personal-assistant second brain"
requires-python = ">=3.11"
dependencies = [
    # The only third-party runtime dependency. Imported lazily, inside
    # OpenAIProvider's constructor, so the test suite never needs it installed
    # and never needs a key -- see python/omega/provider.py.
    "openai>=1.0",
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
python-source = "python"
module-name = "omega._log"
# The crate leaves `extension-module` off by default so `cargo test` can link
# libpython; maturin turns it on for the wheel, where it must be off.
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
